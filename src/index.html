<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows 7</title>
  <link rel="stylesheet" href="./index.css">
</head>
<body>
  <div id="taskbar">
    <img id="start-button" src="./assets/start-button.png" alt="">
    <div class="apps">
      <div class="app">
        <img src="./assets/app-internet-explorer.png" alt="">
      </div>
      <div class="app">
        <img src="./assets/app-file-explorer.png" alt="">
      </div>
      <div class="app">
        <img src="./assets/app-media-player.png" alt="">
      </div>
    </div>
  </div>
  <div class="window">
    <div class="titlebar">
      <div class="icon">
        <img src="./assets/app-media-player.png" alt="">
      </div>
      <div class="control-buttons">
        <div class="min-button"></div>
        <div class="v-bar"></div>
        <div class="max-button"></div>
        <div class="v-bar"></div>
        <div class="close-button"></div>
      </div>
    </div>
    <div class="body">
      <img src="./assets/app-screenshot.jpg" alt="">
    </div>
  </div>
  <script src="./index.js"></script>
</body>
</html>
